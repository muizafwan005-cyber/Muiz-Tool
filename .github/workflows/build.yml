name: Build Muiz

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # Menggunakan dotnet build --no-incremental untuk memaksa kompilasi ulang dari nol
      - name: Build Solution
        run: dotnet build MuizTool.csproj -c Release --no-incremental

      # Menerbitkan single file exe ke folder publish
      - name: Publish Muiz
        run: dotnet publish MuizTool.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload Muiz.exe
        uses: actions/upload-artifact@v4
        with:
          name: Muiz-Windows-x64
          path: publish/
